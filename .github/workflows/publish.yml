name: Build, Test & Publish to NPM

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Syntax & Unit Check
        run: |
          node -c index.js
          node -c daemon.mjs
          if [ -f test.js ]; then node test.js; fi

  publish:
    needs: [build-and-test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 必填：用于 GitHub Actions OIDC Trusted Publishing (免密钥发包)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm with OIDC Trusted Publishing support
        run: npm install -g npm@latest

      - name: Publish to NPM via Trusted Publishing (OIDC)
        run: |
          if [ -n "$CUSTOM_TOKEN" ]; then
            echo "Publishing with secret token..."
            NODE_AUTH_TOKEN="$CUSTOM_TOKEN" npm publish --provenance --access public
          else
            echo "Publishing via OIDC Trusted Publishing (Zero Secrets)..."
            npm publish --provenance --access public
          fi
        env:
          CUSTOM_TOKEN: ${{ secrets.NPM_TOKEN }}
